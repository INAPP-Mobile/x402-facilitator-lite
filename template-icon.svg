<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0E27"/>
      <stop offset="1" stop-color="#1A2050"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2775CA"/>
      <stop offset="1" stop-color="#1B5FBF"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="52" fill="url(#bg)"/>
  <!-- lightning bolt = instant payment -->
  <path d="M148 28 L68 140 h48 L104 228 L188 108 h-50 Z" fill="#F7931A"/>
  <!-- coin ring -->
  <circle cx="128" cy="128" r="88" fill="none" stroke="url(#coin)" stroke-width="10" opacity="0.9"/>
  <!-- orbit dots -->
  <circle cx="128" cy="40" r="8" fill="#2775CA"/>
  <circle cx="216" cy="128" r="8" fill="#2775CA"/>
  <circle cx="128" cy="216" r="8" fill="#2775CA"/>
  <circle cx="40" cy="128" r="8" deployable="no" fill="#2775CA"/>
